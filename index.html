<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- A:HEAD:START -->
<title>Novelle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap">
<style>
/* ============ Tokens: Licht (Basis) ============ */
:root{
  color-scheme: light dark;
  --bg:#EFE8F6;
  --aura:
    radial-gradient(60% 44% at 16% 6%,  rgba(255,168,84,.60), transparent 72%),
    radial-gradient(55% 42% at 88% 20%, rgba(255,214,120,.50), transparent 72%),
    radial-gradient(75% 58% at 50% 58%, rgba(255,79,163,.34),  transparent 74%),
    radial-gradient(85% 62% at 85% 100%,rgba(143,91,222,.42),  transparent 76%),
    radial-gradient(70% 50% at 8% 92%,  rgba(255,138,76,.30),  transparent 74%);
  --surface:rgba(255,255,255,.68);
  --surface2:rgba(255,255,255,.55);
  --glass-border:rgba(255,255,255,.75);
  --hilite:rgba(255,255,255,.65);
  --ink:#231631;
  --muted:#6A5C7D;
  --muted2:#7d7089;
  --line:rgba(35,22,49,.10);
  --dash:rgba(35,22,49,.26);
  --apricot:#FF8A4C; --apricot-text:#A84A12;
  --lilac:#8E5BD9;   --lilac-text:#6C3FBF;
  --gold:#F2A93B;    --gold-text:#8F6A15;
  --rose:#FF4FA3;    --rose-text:#C22571;
  --accent:#C22571;
  --brandgrad:linear-gradient(135deg,#FF4FA3 0%,#FF8A4C 52%,#8E5BD9 100%);
  --proggrad:linear-gradient(90deg,#FF4FA3,#FF8A4C);
  --grad-soft:linear-gradient(135deg,rgba(255,79,163,.14),rgba(255,138,76,.14));
  --danger:#C03B52;
  --shadow:0 2px 6px rgba(60,20,80,.06), 0 14px 38px rgba(60,20,80,.12);
  --nav-bg:rgba(247,242,250,.62);
  --toast-bg:rgba(30,19,44,.92); --toast-ink:#FFF6FB;
}
/* ============ Tokens: Dunkel (System) ============ */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#140E1D;
    --aura:
      radial-gradient(60% 44% at 16% 6%,  rgba(255,138,76,.30), transparent 72%),
      radial-gradient(55% 42% at 88% 20%, rgba(255,196,107,.20), transparent 72%),
      radial-gradient(75% 58% at 50% 58%, rgba(255,79,163,.22),  transparent 74%),
      radial-gradient(85% 62% at 85% 100%,rgba(143,91,222,.30),  transparent 76%),
      radial-gradient(70% 50% at 8% 92%,  rgba(255,138,76,.16),  transparent 74%);
    --surface:rgba(40,28,56,.58);
    --surface2:rgba(255,255,255,.09);
    --glass-border:rgba(255,255,255,.14);
    --hilite:rgba(255,255,255,.14);
    --ink:#F5EFFA;
    --muted:#B4A6C6;
    --muted2:#a293b5;
    --line:rgba(255,255,255,.13);
    --dash:rgba(255,255,255,.30);
    --apricot:#FFA470; --apricot-text:#FFB185;
    --lilac:#B08FE8;   --lilac-text:#C9AEF5;
    --gold:#F7BC58;    --gold-text:#FFCE7A;
    --rose:#FF6FB5;    --rose-text:#FF93C7;
    --accent:#FF93C7;
    --danger:#FF8296;
    --shadow:0 2px 6px rgba(0,0,0,.35), 0 14px 38px rgba(0,0,0,.4);
    --nav-bg:rgba(20,14,29,.6);
    --toast-bg:rgba(245,239,250,.95); --toast-ink:#231631;
  }
}
/* ============ Tokens: Dunkel (explizit gewählt) ============ */
:root[data-theme="dark"]{
  --bg:#140E1D;
  --aura:
    radial-gradient(60% 44% at 16% 6%,  rgba(255,138,76,.30), transparent 72%),
    radial-gradient(55% 42% at 88% 20%, rgba(255,196,107,.20), transparent 72%),
    radial-gradient(75% 58% at 50% 58%, rgba(255,79,163,.22),  transparent 74%),
    radial-gradient(85% 62% at 85% 100%,rgba(143,91,222,.30),  transparent 76%),
    radial-gradient(70% 50% at 8% 92%,  rgba(255,138,76,.16),  transparent 74%);
  --surface:rgba(40,28,56,.58);
  --surface2:rgba(255,255,255,.09);
  --glass-border:rgba(255,255,255,.14);
  --hilite:rgba(255,255,255,.14);
  --ink:#F5EFFA;
  --muted:#B4A6C6;
  --muted2:#a293b5;
  --line:rgba(255,255,255,.13);
  --dash:rgba(255,255,255,.30);
  --apricot:#FFA470; --apricot-text:#FFB185;
  --lilac:#B08FE8;   --lilac-text:#C9AEF5;
  --gold:#F7BC58;    --gold-text:#FFCE7A;
  --rose:#FF6FB5;    --rose-text:#FF93C7;
  --accent:#FF93C7;
  --danger:#FF8296;
  --shadow:0 2px 6px rgba(0,0,0,.35), 0 14px 38px rgba(0,0,0,.4);
  --nav-bg:rgba(20,14,29,.6);
  --toast-bg:rgba(245,239,250,.95); --toast-ink:#231631;
}
/* ============ Farbwelt „Nacht“: Schwarz & Navy ============ */
:root[data-palette="navy"]{
  --bg:#E8ECF3;
  --aura:
    radial-gradient(60% 44% at 16% 6%,  rgba(36,69,126,.34),  transparent 72%),
    radial-gradient(55% 42% at 88% 20%, rgba(127,166,232,.34), transparent 72%),
    radial-gradient(75% 58% at 50% 58%, rgba(62,107,214,.22),  transparent 74%),
    radial-gradient(85% 62% at 85% 100%,rgba(14,27,51,.30),    transparent 76%),
    radial-gradient(70% 50% at 8% 92%,  rgba(62,107,214,.18),  transparent 74%);
  --ink:#131C30; --muted:#566175; --muted2:#6a7488; --line:rgba(19,28,48,.10); --dash:rgba(19,28,48,.28);
  --apricot:#3E6BD6; --apricot-text:#2B4FA8;
  --lilac:#5560C9;   --lilac-text:#3E49AC;
  --gold:#4A7DDC;    --gold-text:#2B4FA8;
  --rose:#24457E;    --rose-text:#1D3765;
  --accent:#2B4FA8;
  --brandgrad:linear-gradient(135deg,#0E1B33 0%,#24457E 52%,#3E6BD6 100%);
  --proggrad:linear-gradient(90deg,#24457E,#3E6BD6);
  --grad-soft:linear-gradient(135deg,rgba(14,27,51,.12),rgba(62,107,214,.14));
  --nav-bg:rgba(240,244,250,.62);
  --toast-bg:rgba(14,22,40,.92); --toast-ink:#F2F6FD;
}
@media (prefers-color-scheme: dark){
  :root[data-palette="navy"]:not([data-theme="light"]){
    --bg:#070A12;
    --aura:
      radial-gradient(60% 44% at 16% 6%,  rgba(36,69,126,.42),  transparent 72%),
      radial-gradient(55% 42% at 88% 20%, rgba(127,166,232,.14), transparent 72%),
      radial-gradient(75% 58% at 50% 58%, rgba(62,107,214,.20),  transparent 74%),
      radial-gradient(85% 62% at 85% 100%,rgba(20,32,58,.55),    transparent 76%),
      radial-gradient(70% 50% at 8% 92%,  rgba(62,107,214,.12),  transparent 74%);
    --surface:rgba(22,32,54,.58); --surface2:rgba(255,255,255,.08);
    --glass-border:rgba(255,255,255,.13); --hilite:rgba(255,255,255,.12);
    --ink:#EDF2FA; --muted:#93A1BC; --muted2:#8492ad; --line:rgba(255,255,255,.12); --dash:rgba(255,255,255,.30);
    --apricot:#6E96E8; --apricot-text:#8FB0F0;
    --lilac:#8C96E8;   --lilac-text:#A6AFF2;
    --gold:#7FA6E8;    --gold-text:#9FBEF2;
    --rose:#5F87DC;    --rose-text:#86A9EC;
    --accent:#86A9EC;
    --proggrad:linear-gradient(90deg,#3E6BD6,#7FA6E8);
    --grad-soft:linear-gradient(135deg,rgba(36,69,126,.28),rgba(62,107,214,.22));
    --danger:#FF8296;
    --shadow:0 2px 6px rgba(0,0,0,.35), 0 14px 38px rgba(0,0,0,.4);
    --nav-bg:rgba(7,10,18,.6);
    --toast-bg:rgba(237,242,250,.95); --toast-ink:#131C30;
  }
}
:root[data-palette="navy"][data-theme="dark"]{
  --bg:#070A12;
  --aura:
    radial-gradient(60% 44% at 16% 6%,  rgba(36,69,126,.42),  transparent 72%),
    radial-gradient(55% 42% at 88% 20%, rgba(127,166,232,.14), transparent 72%),
    radial-gradient(75% 58% at 50% 58%, rgba(62,107,214,.20),  transparent 74%),
    radial-gradient(85% 62% at 85% 100%,rgba(20,32,58,.55),    transparent 76%),
    radial-gradient(70% 50% at 8% 92%,  rgba(62,107,214,.12),  transparent 74%);
  --surface:rgba(22,32,54,.58); --surface2:rgba(255,255,255,.08);
  --glass-border:rgba(255,255,255,.13); --hilite:rgba(255,255,255,.12);
  --ink:#EDF2FA; --muted:#93A1BC; --muted2:#8492ad; --line:rgba(255,255,255,.12); --dash:rgba(255,255,255,.30);
  --apricot:#6E96E8; --apricot-text:#8FB0F0;
  --lilac:#8C96E8;   --lilac-text:#A6AFF2;
  --gold:#7FA6E8;    --gold-text:#9FBEF2;
  --rose:#5F87DC;    --rose-text:#86A9EC;
  --accent:#86A9EC;
  --proggrad:linear-gradient(90deg,#3E6BD6,#7FA6E8);
  --grad-soft:linear-gradient(135deg,rgba(36,69,126,.28),rgba(62,107,214,.22));
  --danger:#FF8296;
  --shadow:0 2px 6px rgba(0,0,0,.35), 0 14px 38px rgba(0,0,0,.4);
  --nav-bg:rgba(7,10,18,.6);
  --toast-bg:rgba(237,242,250,.95); --toast-ink:#131C30;
}

*{box-sizing:border-box}
html{ -webkit-text-size-adjust:100% }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, "Segoe UI", Roboto, Arial, sans-serif;
  font-size:16px; line-height:1.5; min-height:100dvh;
}
/* Aura-Hintergrund */
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:var(--aura);
}
#app{ position:relative; z-index:1; }
#overlays{ position:relative; z-index:60; }
.serif{ font-weight:700; letter-spacing:-.015em; }
button, input, select, textarea{ font:inherit; color:inherit; }
img{ max-width:100%; display:block; }
:focus-visible{ outline:2px solid var(--rose); outline-offset:2px; border-radius:8px; }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation:none !important; transition:none !important; }
}

/* ============ Marke ============ */
.brandmark{
  width:34px; height:34px; border-radius:9px; background:var(--brandgrad);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  box-shadow:0 3px 10px rgba(30,20,60,.25);
}
.brandmark svg{ width:100%; height:100%; display:block; }
.brandmark.big{ width:64px; height:64px; border-radius:17px; margin:0 auto 14px; }
.wordmark{
  font-family:"Instrument Serif", Georgia, "Times New Roman", serif;
  font-weight:400; font-size:27px; line-height:1; letter-spacing:.01em; color:var(--ink);
}
.lockup{ display:flex; align-items:center; gap:11px; }

/* ============ Ladebildschirm ============ */
#splash{
  position:fixed; inset:0; z-index:200; background:var(--brandgrad);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity .25s ease-out; overflow:hidden;
}
#splash::before{ content:''; position:absolute; width:300px; height:300px; border-radius:50%;
  background:#F2A93B; filter:blur(80px); opacity:.5; left:-60px; bottom:120px; }
#splash::after{ content:''; position:absolute; width:220px; height:220px; border-radius:50%;
  background:#F2A93B; filter:blur(80px); opacity:.35; right:-40px; top:60px; }
#splash .bm{ width:108px; height:108px; position:relative; }
#splash .wm{
  font-family:"Instrument Serif", Georgia, serif; font-weight:400; font-size:64px;
  line-height:1; letter-spacing:.01em; color:#fff; margin-top:26px; position:relative;
}
#splash .ws{
  font-size:11px; letter-spacing:.3em; text-transform:uppercase;
  color:rgba(255,255,255,.72); margin-top:10px; position:relative;
}
#splash .spin{
  position:absolute; bottom:64px; left:50%; margin-left:-17px;
  width:34px; height:34px; border-radius:50%;
  border:2px solid rgba(255,255,255,.3); border-top-color:#fff;
  animation:spin .9s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg) } }

/* ============ App-Shell ============ */
#app{ max-width:540px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; }
header.app{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 20px 10px; background:var(--nav-bg);
  -webkit-backdrop-filter:blur(22px) saturate(1.6); backdrop-filter:blur(22px) saturate(1.6);
  border-bottom:1px solid var(--glass-border);
}
main{ flex:1; padding:14px 16px calc(96px + env(safe-area-inset-bottom)); }

/* Sektions-Label */
.slabel, h2.section, .eyebrow{
  font-size:12px; font-weight:600; letter-spacing:.2em; text-transform:uppercase;
  color:var(--muted); margin:26px 2px 12px;
}
.slabel:first-child, h2.section:first-child{ margin-top:2px; }

/* ============ Bottom-Navigation ============ */
nav.tabs{
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  background:var(--nav-bg);
  -webkit-backdrop-filter:blur(22px) saturate(1.6); backdrop-filter:blur(22px) saturate(1.6);
  border-top:1px solid var(--glass-border);
}
nav.tabs .inner{
  max-width:540px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
}
nav.tabs button{
  appearance:none; background:none; border:0; cursor:pointer;
  min-height:52px; display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--muted); font-size:11px; font-weight:600; letter-spacing:.01em; border-radius:14px; padding:6px 0 4px;
}
nav.tabs button svg{ width:24px; height:24px; }
nav.tabs button.active{ color:var(--rose-text); }
nav.tabs button:active{ transform:scale(.97); opacity:.9; transition:transform .12s ease-out, opacity .12s ease-out; }

/* ============ Bausteine ============ */
.card{
  background:var(--surface); border:1px solid var(--glass-border); border-radius:24px;
  -webkit-backdrop-filter:blur(20px) saturate(1.5); backdrop-filter:blur(20px) saturate(1.5);
  box-shadow:var(--shadow); padding:18px;
}
.stack{ display:flex; flex-direction:column; gap:14px; }
.row{ display:flex; align-items:center; gap:10px; }
.grow{ flex:1; min-width:0; }
.hint{ color:var(--muted); font-size:14px; }
.small{ font-size:13px; }
hr.sep{ border:0; border-top:1px solid var(--line); margin:18px 0; }

.btn{
  appearance:none; border:1px solid var(--glass-border); background:var(--surface);
  box-shadow:inset 0 1px 0 var(--hilite);
  -webkit-backdrop-filter:blur(14px) saturate(1.4); backdrop-filter:blur(14px) saturate(1.4);
  border-radius:999px; padding:11px 18px; font-weight:600; font-size:15px; cursor:pointer;
  min-height:46px; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  color:var(--ink);
}
.btn:active, .iconbtn:active, .shelfitem:active, .addtile:active, .palcard:active{
  transform:scale(.97); opacity:.9; transition:transform .12s ease-out, opacity .12s ease-out;
}
.btn.primary, .btn.accent{
  background:var(--grad-soft), var(--surface);
  -webkit-backdrop-filter:blur(18px) saturate(1.7); backdrop-filter:blur(18px) saturate(1.7);
  color:var(--ink); border:1px solid var(--glass-border);
  box-shadow:inset 0 1px 0 var(--hilite), 0 4px 16px rgba(60,20,80,.12);
  font-weight:700;
}
.btn.ghost{ background:transparent; border-color:transparent; box-shadow:none; -webkit-backdrop-filter:none; backdrop-filter:none; }
.btn.sm{ padding:8px 14px; min-height:44px; font-size:13.5px; }
.btn.danger{ color:var(--danger); border-color:color-mix(in srgb, var(--danger) 40%, transparent); }
.btn:disabled{ opacity:.55; cursor:default; box-shadow:none; }
.btn.block{ width:100%; }

.chip{
  display:inline-flex; align-items:center; gap:5px;
  font-size:12.5px; font-weight:600; padding:4px 11px; border-radius:999px;
  background:var(--surface2); border:1px solid var(--glass-border); color:var(--muted); white-space:nowrap;
}
.chip.apricot{ background:color-mix(in srgb, var(--apricot) 16%, transparent); border-color:color-mix(in srgb, var(--apricot) 26%, transparent); color:var(--apricot-text); }
.chip.lilac  { background:color-mix(in srgb, var(--lilac) 15%, transparent);   border-color:color-mix(in srgb, var(--lilac) 26%, transparent);   color:var(--lilac-text); }
.chip.gold   { background:color-mix(in srgb, var(--gold) 18%, transparent);    border-color:color-mix(in srgb, var(--gold) 30%, transparent);    color:var(--gold-text); }
.chip.rose   { background:color-mix(in srgb, var(--rose) 15%, transparent);    border-color:color-mix(in srgb, var(--rose) 26%, transparent);    color:var(--rose-text); }

/* Formulare */
label.f{ display:block; margin-bottom:12px; }
label.f .lab, .lab{
  display:block; font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); margin-bottom:5px;
}
input.f, select.f, textarea.f{
  width:100%; border:1px solid var(--glass-border); border-radius:14px; background:var(--surface2);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  padding:11px 13px; font-size:16px; min-height:46px;
}
input.f::placeholder, textarea.f::placeholder{ color:var(--muted); opacity:.75; }
textarea.f{ min-height:96px; resize:vertical; }
.f2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.check{ display:flex; gap:10px; align-items:flex-start; font-size:15px; margin-bottom:12px; }
.check input{ width:20px; height:20px; margin-top:2px; accent-color:var(--rose); }

/* Cover */
.cover{
  border-radius:10px; overflow:hidden; background:var(--surface2);
  aspect-ratio:2/3; position:relative; flex-shrink:0;
  box-shadow:0 4px 14px rgba(60,20,80,.22);
}
.cover img{ width:100%; height:100%; object-fit:cover; }
.cover .ph{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-weight:800; letter-spacing:-0.02em; color:rgba(255,255,255,.95);
  font-size:26px; text-shadow:0 1px 5px rgba(0,0,0,.22); padding:8px; text-align:center;
}
.cover .ph small{ font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; display:block; opacity:.9 }

/* Gerade am Lesen */
.readrow{
  display:flex; flex-direction:column; padding:16px; margin-bottom:14px;
  background:var(--surface); border:1px solid var(--glass-border); border-radius:24px;
  -webkit-backdrop-filter:blur(20px) saturate(1.5); backdrop-filter:blur(20px) saturate(1.5);
  box-shadow:var(--shadow);
}
.readrow .rowtop{ display:flex; gap:14px; }
.readrow .cover{ width:104px; }
.readrow h3{ margin:2px 0 3px; font-size:20px; font-weight:700; letter-spacing:-.015em; line-height:1.22; text-wrap:balance; }
.author{ color:var(--muted); font-size:13px; margin-bottom:7px; }
.progress{ height:6px; border-radius:99px; background:var(--surface2); border:1px solid var(--glass-border); overflow:hidden; margin:10px 0 5px; }
.progress i{ display:block; height:100%; background:var(--proggrad); border-radius:99px; }
.plabel{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.readrow .acts{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:14px; }
.readrow .acts .btn{
  min-height:40px; padding:7px 4px; font-size:12.5px; font-weight:600; gap:5px; white-space:nowrap;
  background:color-mix(in srgb, var(--surface2) 62%, transparent);
  border-color:color-mix(in srgb, var(--glass-border) 55%, transparent);
  box-shadow:none;
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}
.readrow .acts .btn.accent{
  background:var(--grad-soft), color-mix(in srgb, var(--surface2) 45%, transparent);
  font-weight:700;
}
.readrow .acts .ic{ width:15px; height:15px; }

/* Regal-Raster */
.shelfgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px 14px; align-items:start; }
.shelfitem{ appearance:none; background:none; border:0; padding:0; cursor:pointer; text-align:left; min-width:0; width:100%; }
.shelfitem .cover{ width:100%; }
.shelfitem .done{ display:flex; gap:5px; margin-top:5px; color:var(--muted2); }
.shelfitem .done .ic{ width:12px; height:12px; }
.shelfitem .done .msep{ width:1px; height:10px; background:var(--dash); margin:0 3px; align-self:center; }
.shelfitem .t{ font-size:12.5px; font-weight:600; line-height:1.3; margin-top:7px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; color:var(--ink); }
.shelfitem .y{ font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
.addtile{
  appearance:none; aspect-ratio:2/3; align-self:start; width:100%;
  border:1.5px dashed var(--dash); border-radius:10px;
  background:var(--surface2); color:var(--muted); cursor:pointer;

  display:flex; align-items:center; justify-content:center;
}
.addtile svg{ width:22px; height:22px; }
.badge-year{
  position:absolute; bottom:6px; right:6px; font-size:10.5px; font-weight:700;
  background:rgba(24,14,32,.55); color:#fff; padding:3px 8px; border-radius:99px;
  font-variant-numeric:tabular-nums; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
}
.badge-series{
  position:absolute; top:6px; left:6px; font-size:10.5px; font-weight:700;
  background:rgba(24,14,32,.55); color:#fff; padding:3px 8px; border-radius:99px;
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
}

/* Filterzeile */
.filters{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 12px; scrollbar-width:none; }
.filters::-webkit-scrollbar{ display:none }
.filters select{
  border:1px solid var(--glass-border); background:var(--surface); border-radius:999px;
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);

}
.searchwrap{ position:relative; margin-bottom:10px; }
.searchwrap svg{ position:absolute; left:15px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--muted); z-index:1; pointer-events:none; }
.searchwrap input{ padding-left:42px; border-radius:999px; background:var(--surface); }

/* Overlays / Sheets */
#overlays .sheet{
  position:fixed; inset:0; z-index:60; background:var(--bg);
  display:flex; flex-direction:column; animation:sheetIn .22s ease;
}
#overlays .sheet::before{
  content:''; position:absolute; inset:0; z-index:0; pointer-events:none; background:var(--aura);
}

@keyframes sheetIn{ from{ transform:translateY(24px); opacity:0 } to{ transform:none; opacity:1 } }
.sheet .shead{
  position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px;
  padding:12px 14px; background:var(--nav-bg);
  -webkit-backdrop-filter:blur(22px) saturate(1.6); backdrop-filter:blur(22px) saturate(1.6);
  border-bottom:1px solid var(--glass-border);
}
.sheet .shead h2{ margin:0; font-size:17px; font-weight:700; letter-spacing:-.01em; flex:1; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sheet .sbody{ flex:1; overflow-y:auto; padding:16px 16px calc(28px + env(safe-area-inset-bottom)); }
.sheet .sbody .inner, .sheet .shead{ max-width:540px; margin:0 auto; width:100%; }
.iconbtn{
  appearance:none; border:1px solid var(--glass-border); background:var(--surface); border-radius:999px;
  box-shadow:inset 0 1px 0 var(--hilite);

  color:var(--ink);
}
.iconbtn svg{ width:20px; height:20px }

/* Detail */
.detailhead{ display:flex; gap:16px; margin:14px 0 16px; }
.detailhead .cover{ width:110px; }
.detailhead h2{ margin:2px 0 2px; font-size:22px; font-weight:700; letter-spacing:-.02em; line-height:1.2; text-wrap:balance; }
.metalist{ display:flex; flex-direction:column; gap:0; }
.metalist .mrow{ display:flex; justify-content:space-between; gap:14px; padding:10px 2px; border-bottom:1px solid var(--line); font-size:14.5px; }
.metalist .mrow:last-child{ border-bottom:0 }
.metalist .k{ color:var(--muted); }
.metalist .v{ font-weight:600; text-align:right; font-variant-numeric:tabular-nums; }

/* Bewertung 1–10 */
.rate10{ display:flex; gap:4px; }
.rate10 button{
  appearance:none; flex:1; min-width:0; min-height:38px; border-radius:999px; cursor:pointer;
  border:1px solid var(--glass-border); background:var(--surface2);
  font-size:12.5px; font-weight:700; color:var(--muted); padding:0;
  font-variant-numeric:tabular-nums;
}
.rate10 button.on{ background:var(--proggrad); border-color:transparent; color:#fff; }

/* Sterne */
.stars{ display:inline-flex; gap:2px; }
.stars button{ appearance:none; background:none; border:0; padding:8px 5px; cursor:pointer; min-width:38px; min-height:44px; }
.stars svg{ width:28px; height:28px; color:var(--line); }
.stars .on svg{ color:var(--gold); }
.stars.readonly svg{ width:18px; height:18px }

/* Chat */
.chatlog{ display:flex; flex-direction:column; gap:10px; padding-bottom:8px; }
.msg{ max-width:82%; padding:11px 15px; border-radius:20px; font-size:15px; line-height:1.5; white-space:pre-wrap; overflow-wrap:break-word; }
.msg.user{ align-self:flex-end; background:var(--grad-soft), var(--surface); color:var(--ink);
  border:1px solid var(--glass-border); box-shadow:inset 0 1px 0 var(--hilite);
  -webkit-backdrop-filter:blur(14px) saturate(1.5); backdrop-filter:blur(14px) saturate(1.5);
  border-bottom-right-radius:7px; }
.msg.bot{ align-self:flex-start; background:var(--surface); border:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-bottom-left-radius:7px; }
.msg.bot.thinking{ color:var(--muted); font-style:italic }
.chatbar{ position:sticky; bottom:0; display:flex; gap:8px; padding:10px 0 0; }
.chatbar textarea{ flex:1; border-radius:22px; min-height:46px; max-height:120px; padding:11px 16px; background:var(--surface); }
.spoilerbar{
  display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600;
  background:color-mix(in srgb, var(--lilac) 14%, transparent); border:1px solid color-mix(in srgb, var(--lilac) 24%, transparent);
  color:var(--lilac-text);
  border-radius:14px; padding:9px 13px; margin:14px 0 12px;
}
.spoilerbar svg{ width:17px; height:17px; flex-shrink:0 }

/* Statistik */
.baryear{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.baryear .yl{ width:44px; font-size:13px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; }
.baryear .bar{ height:20px; border-radius:7px; background:var(--proggrad); min-width:5px; }
.baryear .n{ font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }
.statgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
.stat{
  background:var(--surface); border:1px solid var(--glass-border); border-radius:18px;

  padding:14px 10px; text-align:center;
}
.stat b{ display:block; font-size:26px; font-weight:800; letter-spacing:-0.03em; font-variant-numeric:tabular-nums;
  background:var(--proggrad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:var(--rose-text); }
.stat span{ font-size:11.5px; color:var(--muted); font-weight:600; }

/* Fragen-Flow */
.flowstep{ font-size:12px; font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--rose-text); margin:14px 0 8px; }
.flowq{ font-size:22px; font-weight:700; letter-spacing:-.02em; line-height:1.28; margin:0 0 14px; text-wrap:balance; }
.flowdots{ display:flex; gap:5px; margin:14px 0 18px; }
.flowdots i{ height:4px; flex:1; border-radius:99px; background:var(--surface2); border:1px solid var(--glass-border); }

/* Empty-States */
.empty{ text-align:center; padding:44px 22px; color:var(--muted); }
.empty h3{ color:var(--ink); font-weight:700; letter-spacing:-.015em; margin:0 0 6px; font-size:18px; }

/* Toast */
#toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(104px + env(safe-area-inset-bottom));
  background:var(--toast-bg); color:var(--toast-ink); font-size:14px; font-weight:600;
  padding:11px 20px; border-radius:999px; z-index:99; box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  opacity:0; pointer-events:none; transition:opacity .2s;
  max-width:88vw; text-align:center;
}
#toast.show{ opacity:1 }

/* KI-Text */
.aitext{ font-size:15px; line-height:1.6; }
.aitext p{ margin:0 0 10px }
.aitext strong{ font-weight:700 }
.aitext ol,.aitext ul{ padding-left:20px; margin:0 0 10px }
.aitext li{ margin-bottom:8px }

.reflection-a{ background:var(--surface2); border:1px solid var(--glass-border); border-radius:14px; padding:11px 14px; font-size:14.5px; margin:4px 0 14px; white-space:pre-wrap; }

.intro{ background:var(--grad-soft), var(--surface); }
a{ color:var(--rose-text); font-weight:600; }

.ic{ width:17px; height:17px; flex-shrink:0; vertical-align:-3px; }

/* ============ Desktop (ab 900px) ============ */
@media (min-width: 900px){
  :root{ --cleft:max(264px, calc((100vw - 980px) / 2)); }
  #app{ max-width:none; margin:0; display:block; }
  main{ max-width:980px; margin-left:var(--cleft); margin-right:auto; padding:36px 44px 70px; }
  header.app{
    position:fixed; left:0; top:0; width:264px;
    background:transparent; -webkit-backdrop-filter:none; backdrop-filter:none;
    border-bottom:0; padding:30px 26px 8px;
  }
  nav.tabs{
    left:0; right:auto; top:96px; bottom:auto; width:264px;
    background:transparent; -webkit-backdrop-filter:none; backdrop-filter:none; border-top:0;
  }
  nav.tabs .inner{ display:flex; flex-direction:column; gap:4px; padding:0 16px; max-width:none; }
  nav.tabs button{
    flex-direction:row; justify-content:flex-start; gap:12px;
    min-height:46px; font-size:15px; padding:10px 14px; border-radius:14px;
  }
  nav.tabs button.active{ background:var(--surface); box-shadow:inset 0 0 0 1px var(--glass-border); }
  .shelfgrid{ grid-template-columns:repeat(5,1fr); gap:24px 18px; }
  .f2{ grid-template-columns:1fr 1fr; }
  #overlays .sheet{
    inset:4vh auto 4vh calc(var(--cleft) + (min(980px, 100vw - var(--cleft)) - min(700px, 100vw - 296px)) / 2);
    width:min(700px, calc(100vw - 296px));
    border-radius:26px; border:1px solid var(--glass-border);
    box-shadow:var(--shadow); overflow:hidden;
  }
  .sheet .shead, .sheet .sbody .inner{ max-width:none; }
  .sheet .sbody{ padding:16px 28px 32px; }
  #toast{ bottom:44px; }
}
@media (hover:hover){
  .btn:hover, .iconbtn:hover, .filters select:hover{ filter:brightness(1.05); }
  nav.tabs button:hover{ color:var(--ink); }
  .shelfitem .cover{ transition:transform .15s ease; }
  .shelfitem:hover .cover{ transform:translateY(-3px); }
  .palcard:hover{ border-color:var(--dash); }
}

/* Medium-Schalter */
.seg{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.segbtn{
  appearance:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  padding:8px 2px; min-height:54px; border-radius:12px; cursor:pointer;
  border:1px solid var(--glass-border); background:var(--surface2);
  color:var(--muted); font-size:10.5px; font-weight:600; white-space:nowrap;
}
.segbtn .ic{ width:18px; height:18px; }
.segbtn.on{
  background:var(--grad-soft), var(--surface); color:var(--ink);
  box-shadow:inset 0 1px 0 var(--hilite); font-weight:700;
}

/* Menü-Zeilen (Listen-Buttons im Buchdetail) */
.btn.menu{

}
.btn.menu .chev{ margin-left:auto; display:flex; opacity:.4; }
.btn.menu .chev .ic{ width:16px; height:16px; }

/* Farbwelt-Auswahl */
.palpick{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:4px; }
.palcard{ appearance:none; padding:0; text-align:left; cursor:pointer; border-radius:18px; overflow:hidden;
  border:2px solid var(--glass-border); background:var(--surface); box-shadow:var(--shadow); }
.palcard.active{ border-color:var(--rose); }
.palcard .prev{ display:block; height:126px; padding:12px 12px 0; }
.palcard .minihead{ display:flex; align-items:center; gap:6px; margin-bottom:9px; }
.palcard .minihead i{ width:16px; height:16px; border-radius:5px; display:block; }
.palcard .minihead b{ font-family:"Instrument Serif", Georgia, serif; font-weight:400; font-size:13px; letter-spacing:.01em; }
.palcard .minicard{ display:block; border-radius:12px; border:1px solid transparent; padding:9px 10px; }
.palcard .minicard i{ display:block; border-radius:99px; }
.palcard .minicard .l1{ height:7px; width:70%; margin-bottom:6px; }
.palcard .minicard .l2{ height:7px; width:45%; margin-bottom:9px; }
.palcard .minicard .bar{ height:5px; width:100%; }
.palmeta{ display:flex; align-items:center; gap:7px; padding:10px 12px; }
.palmeta strong{ font-size:14px; }
.palmeta span{ font-size:11.5px; color:var(--muted); flex:1; }
.palmeta em{ font-style:normal; font-weight:800; color:var(--rose-text); }

.empty .big{ font-size:40px; margin-bottom:8px; }
</style>

<script>
'use strict';
/* =====================================================================
   Novelle – dein digitales Bücherregal
   Daten bleiben lokal auf dem Gerät (localStorage). Optional lässt sich
   ein Google-Gemini-API-Schlüssel hinterlegen, der Chat, Fragenkatalog,
   Fakten und Empfehlungen mit echter KI betreibt (außerhalb der
   Artifact-Sandbox; dort greifen die lokalen Begleiter-Funktionen).
   ===================================================================== */

const DB_KEY = 'eselsohr.v1';

const GENRES = ['Roman','Belletristik','Krimi & Thriller','Fantasy','Science-Fiction','Liebesroman','Historischer Roman','Sachbuch','Biografie','Ratgeber','Klassiker','Jugendbuch','Horror','Kurzgeschichten','Lyrik','Sonstiges'];
const FICTION = new Set(['Roman','Belletristik','Krimi & Thriller','Fantasy','Science-Fiction','Liebesroman','Historischer Roman','Klassiker','Jugendbuch','Horror','Kurzgeschichten']);
const LANGS = ['Deutsch','Englisch','Französisch','Spanisch','Italienisch','Andere'];
const MEDIA = {
  print:  { label:'Physisch',          short:'Physisch', icon:'book' },
  kindle: { label:'Kindle / E-Book',   short:'E-Book',   icon:'tablet' },
  audio:  { label:'Audible / Hörbuch', short:'Hörbuch',  icon:'headphones' },
};
const ACCENTS = ['apricot','lilac','gold','rose'];

/* ---------- Zustand ---------- */
let state = load();
const ui = {
  tab: 'reading',
  shelf: { q:'', year:'', genre:'', lang:'', medium:'', series:'', sort:'year-desc' },
  deleteArmed: null,
};

function migrateState(st){
  if(!st.settings) st.settings = {};
  if(st.settings.ratingScale !== 10){
    (st.books||[]).forEach(b => { if(b.rating) b.rating = Math.min(10, Math.round(b.rating * 2)); });
    st.settings.ratingScale = 10;
  }
  return st;
}
function load(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){ const s = JSON.parse(raw); if(s && Array.isArray(s.books)) return migrateState(s); }
  }catch(e){}
  return { books: [], settings: { ratingScale: 10 }, recs: [] };
}
function persist(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(state)); }
  catch(e){ toast('Speichern fehlgeschlagen – Speicher voll? Exportiere ein Backup.'); }
}
function save(){ persist(); scheduleSync(); }
function touch(b){ if(b) b.updatedAt = Date.now(); }

/* ---------- Helfer ---------- */
const $  = s => document.querySelector(s);
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2)); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(iso){ if(!iso) return '–'; try{ return new Intl.DateTimeFormat('de-DE',{day:'numeric',month:'short',year:'numeric'}).format(new Date(iso+'T12:00:00')); }catch(e){ return iso; } }
function daysBetween(a,b){ try{ return Math.max(0, Math.round((new Date(b)-new Date(a))/86400000)); }catch(e){ return null; } }
function getBook(id){ return state.books.find(b => b.id === id); }
function hashN(str, mod){ let h=0; for(const c of String(str)) h=(h*31 + c.charCodeAt(0))>>>0; return h % mod; }
function readYearOf(b){
  if(b.endDate) return new Date(b.endDate+'T12:00:00').getFullYear();
  if(b.readYear) return Number(b.readYear);
  return null;
}
function genreAccent(g){ return ACCENTS[hashN(g||'x', ACCENTS.length)]; }
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), 2600);
}
function progressPct(b){
  const p=b.progress; if(!p) return null;
  if(p.type==='percent' && p.current!=null) return Math.min(100, Number(p.current));
  if(p.total && p.current!=null) return Math.min(100, Math.round(100*Number(p.current)/Number(p.total)));
  return null;
}
function progressLabel(b){
  const p=b.progress; if(!p || p.current==null || p.current==='') return 'Noch kein Fortschritt eingetragen';
  if(p.type==='percent') return `${p.current} % gelesen`;
  const unit = p.type==='chapter' ? 'Kap.' : 'S.';
  return p.total ? `${unit} ${p.current} von ${p.total}` : `${unit} ${p.current}`;
}
function boundaryLabel(b){
  const p=b.progress;
  if(!p || p.current==null || p.current==='') return 'Anfang des Buches';
  if(p.type==='percent') return `${p.current} % des Buches`;
  return (p.type==='chapter'?'Kapitel ':'Seite ')+p.current+(p.total?` von ${p.total}`:'');
}

function resizeImage(file, cb){
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const MAX = 440;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => toast('Bild konnte nicht gelesen werden.');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/* =====================================================================
   KI-Anbindung (optional, per API-Schlüssel in den Einstellungen)
   ===================================================================== */
function aiAvailable(){ return !!(state.settings && state.settings.apiKey); }
function geminiModel(){
  const m = state.settings.model;
  return (m && m.indexOf('gemini') === 0) ? m : 'gemini-3.5-flash-lite';
}
async function aiCall(messages, system, maxTokens=1200){
  const key = state.settings.apiKey;
  if(!key) throw new Error('kein-schluessel');
  const body = {
    contents: messages.map(m => ({ role: m.role==='assistant' ? 'model' : 'user', parts: [{ text: m.content }] })),
    generationConfig: { maxOutputTokens: Math.max(2048, maxTokens*2) },
  };
  if(system) body.systemInstruction = { parts: [{ text: system }] };
  let res;
  try{
    res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+geminiModel()+':generateContent', {
      method:'POST',
      headers:{ 'content-type':'application/json', 'x-goog-api-key': key },
      body: JSON.stringify(body),
    });
  }catch(e){ const err = new Error('netz'); err.network = true; throw err; }
  if(!res.ok){
    const err = new Error('api-'+res.status); err.httpStatus = res.status;
    try{ const j = await res.json(); err.apiStatus = (j && j.error && j.error.status) || ''; }catch(e2){}
    throw err;
  }
  const data = await res.json();
  const parts = (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
  const text = parts.filter(pt => !pt.thought && typeof pt.text === 'string').map(pt => pt.text).join('');
  if(!text) throw new Error('leer');
  return text;
}
function aiBlockedHint(){
  return 'Die KI-Verbindung hat nicht geklappt. In der geschützten Artifact-Ansicht sind externe Verbindungen gesperrt – dort arbeitet Novelle im lokalen Begleiter-Modus. Als eigenständig installierte App (siehe README) funktioniert Gemini mit deinem API-Schlüssel.';
}
function aiErrorMessage(e){
  const code = (e && e.httpStatus) || 0, st = (e && e.apiStatus) || '';
  if(code===400 || code===403 || st==='INVALID_ARGUMENT' || st==='PERMISSION_DENIED')
    return 'Der Gemini-API-Schlüssel scheint ungültig zu sein. Prüfe ihn unter „Mehr → KI-Verbindung“ – bis dahin arbeitet Novelle im Begleiter-Modus.';
  if(code===429 || st==='RESOURCE_EXHAUSTED')
    return 'Das Tageslimit der Gemini-Gratis-Stufe ist erreicht – morgen geht es weiter. Bis dahin arbeitet Novelle im Begleiter-Modus.';
  if(code===404 || st==='NOT_FOUND')
    return 'Das gewählte Gemini-Modell ist nicht verfügbar. Wähle unter „Mehr → KI-Verbindung“ ein anderes Modell.';
  return aiBlockedHint();
}
/* Sehr kleine Markdown-Aufbereitung für KI-Antworten */
function md(t){
  let h = esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(https?:\/\/[^\s<]+[^\s<.,)])/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  const lines = h.split(/\n/); let out=[], list=null;
  for(const ln of lines){
    const m = ln.match(/^\s*(\d+)[.)]\s+(.*)/);
    const b = ln.match(/^\s*[-•]\s+(.*)/);
    if(m){ if(list!=='ol'){ if(list)out.push(`</${list}>`); out.push('<ol>'); list='ol'; } out.push('<li>'+m[2]+'</li>'); }
    else if(b){ if(list!=='ul'){ if(list)out.push(`</${list}>`); out.push('<ul>'); list='ul'; } out.push('<li>'+b[1]+'</li>'); }
    else { if(list){ out.push(`</${list}>`); list=null; } if(ln.trim()) out.push('<p>'+ln+'</p>'); }
  }
  if(list) out.push(`</${list}>`);
  return out.join('');
}

/* =====================================================================
   Fragen-Engine: persönlicher Reflexions-Katalog (lokal, immer verfügbar)
   ===================================================================== */
function buildQuestions(b){
  const qs = [];
  const genre = b.genre || 'Sonstiges';
  const fiction = FICTION.has(genre);

  qs.push('Worum ging es in diesem Buch für dich – jenseits der reinen Handlung?');
  qs.push('Was nimmst du aus diesem Buch für dich und deine Zukunft mit?');
  qs.push('Welche Szene oder Stelle wird dir im Gedächtnis bleiben – und warum gerade die?');

  if(fiction){
    qs.push('Aus welcher Erzählperspektive wird erzählt – und wie hat das deine Nähe zu den Figuren geprägt?');
    qs.push('Welche Figur hat dich am meisten beschäftigt, positiv oder negativ?');
  } else {
    qs.push('Welche zwei, drei Erkenntnisse willst du dir unbedingt merken?');
    qs.push('Wo warst du anderer Meinung als der Autor bzw. die Autorin – und warum?');
  }

  const special = {
    'Krimi & Thriller':'War die Auflösung für dich stimmig und fair angelegt? Hattest du unterwegs einen Verdacht?',
    'Fantasy':'Wie hat dich die Welt des Buches überzeugt – was fandest du besonders originell?',
    'Science-Fiction':'Welche Idee des Buches hat dich am meisten zum Nachdenken gebracht – und wirkt sie plausibel?',
    'Liebesroman':'Was hat die Beziehung(en) für dich glaubwürdig gemacht – oder eben nicht?',
    'Historischer Roman':'Was hast du über die Zeit gelernt, in der das Buch spielt?',
    'Horror':'Womit hat dich das Buch am meisten gepackt oder verstört – Atmosphäre, Bilder, Ideen?',
    'Klassiker':'Warum, glaubst du, hat dieses Buch überdauert? Wie liest es sich heute für dich?',
    'Biografie':'Was hat dich an diesem Leben überrascht – und was davon berührt dein eigenes?',
    'Ratgeber':'Was willst du ganz konkret als Erstes ausprobieren oder umsetzen?',
    'Sachbuch':'Wie hat das Buch deinen Blick auf das Thema verändert?',
    'Jugendbuch':'Was macht dieses Buch für dich besonders – auch im Vergleich zu „Erwachsenen“-Büchern?',
    'Kurzgeschichten':'Welche Geschichte ragt für dich heraus – und was verbindet die Sammlung?',
    'Lyrik':'Welche Zeilen möchtest du dir merken – laut gelesen oder still?',
  };
  if(special[genre]) qs.push(special[genre]);

  if(b.medium==='audio') qs.push('Wie hat die Stimme des Sprechers bzw. der Sprecherin das Buch für dich geprägt?');
  else if(b.medium==='kindle') qs.push('Hast du Stellen markiert? Welche würdest du jemandem laut vorlesen?');
  else qs.push('Wirst du das Buch behalten, verleihen oder weitergeben – und wem würdest du es empfehlen?');

  if(b.series && b.series.name){
    qs.push(`Wie fügt sich dieser Band in die Reihe „${b.series.name}“ ein – und freust du dich auf den nächsten?`);
  } else if(b.startDate && b.endDate){
    const d = daysBetween(b.startDate, b.endDate);
    if(d!=null && d<=7) qs.push(`Du hast das Buch in nur ${d===0?'einem Tag':d+' Tagen'} gelesen – was hat dich so hineingezogen?`);
    else if(d!=null && d>60) qs.push('Du warst lange mit diesem Buch unterwegs. Was hat dich immer wieder zurückkehren lassen?');
    else qs.push('Was hat dir an diesem Buch besonders gut gefallen – und was hätte es nicht gebraucht?');
  } else {
    qs.push('Was hat dir besonders gut gefallen – und was hätte es nicht gebraucht?');
  }
  return qs.slice(0, 8);
}
function buildMidQuestions(b){
  return [
    `Wo stehst du gerade (${boundaryLabel(b)}) – und wie fühlt sich das Buch bis hierhin an?`,
    'Was ist bisher passiert? Fasse es in ein paar Sätzen für dein späteres Ich zusammen.',
    'Welche Figur oder Stimme beschäftigt dich gerade am meisten – und warum?',
    'Welche Stelle hat dich bisher am meisten überrascht oder berührt?',
    'Was vermutest du: Wie geht es weiter – und wie soll es ausgehen?',
  ];
}
async function personalizedQuestions(b, mode='final'){
  if(mode==='mid'){
    if(aiAvailable()){
      try{
        const raw = await aiCall([{role:'user', content:
`Erstelle 5 kurze Reflexionsfragen für jemanden, der das Buch "${b.title}"${b.author?` von ${b.author}`:''} gerade LIEST und aktuell bei ${boundaryLabel(b)} ist. Die Fragen helfen, den Zwischenstand festzuhalten (was bisher geschah, Eindrücke zu Figuren und Stil, Vermutungen) – sie dürfen NICHTS über spätere Inhalte verraten oder andeuten. Deutsch, Du-Form. Antworte NUR mit einem JSON-Array aus 5 Strings.`}],
          'Du bist ein einfühlsamer Lesecoach. Antworte ausschließlich mit validem JSON.', 700);
        const m = raw.match(/\[[\s\S]*\]/);
        if(m){ const arr = JSON.parse(m[0]); if(Array.isArray(arr) && arr.length>=4) return { qs: arr.slice(0,6).map(String), ai:true }; }
      }catch(e){ /* lokal weitermachen */ }
    }
    return { qs: buildMidQuestions(b), ai:false };
  }
  if(aiAvailable()){
    try{
      const raw = await aiCall(
        [{role:'user', content:
          `Erstelle einen persönlichen Reflexions-Fragenkatalog (genau 7 Fragen) für jemanden, der soeben das Buch "${b.title}"${b.author?` von ${b.author}`:''} beendet hat. Genre: ${b.genre||'unbekannt'}. Gelesen als: ${MEDIA[b.medium]?.label||'unbekannt'}. Sprache des Buches: ${b.language||'unbekannt'}.${b.series&&b.series.name?` Das Buch ist Band ${b.series.volume||'?'} der Reihe "${b.series.name}".`:''}
Die Fragen sollen in 5–10 Minuten beantwortbar sein, auf Deutsch und in Du-Form. Beziehe dich, wo du das Buch kennst, konkret auf seine Themen und Machart. Enthalte mindestens: eine Frage zu dem, was man für die Zukunft mitnimmt; eine zu einem besonderen Moment; eine zur Erzählperspektive bzw. Machart; eine genrespezifische Frage.
Antworte NUR mit einem JSON-Array aus 7 Strings, ohne weiteren Text.`}],
        'Du bist ein einfühlsamer Lesecoach. Antworte ausschließlich mit validem JSON.',
        900
      );
      const m = raw.match(/\[[\s\S]*\]/);
      if(m){
        const arr = JSON.parse(m[0]);
        if(Array.isArray(arr) && arr.length>=5) return { qs: arr.slice(0,8).map(String), ai:true };
      }
    }catch(e){ /* lokal weitermachen */ }
  }
  return { qs: buildQuestions(b), ai:false };
}

/* =====================================================================
   Lese-Begleiter (Chat ohne KI): Reflexionsfragen je nach Fortschritt
   ===================================================================== */
function companionReply(b, userText){
  const pct = progressPct(b);
  const early = pct==null || pct < 30, late = pct!=null && pct >= 70;
  const pools = {
    question: [
      'Gute Frage! Ohne KI-Verbindung kann ich inhaltlich leider nicht antworten – aber schreib gern auf, was du selbst vermutest. Gedanken sortieren hilft oft mehr als eine schnelle Antwort.',
      'Das kann ich im Begleiter-Modus nicht beantworten. Aber: Was wäre deine Theorie? Notiere sie – beim Weiterlesen macht es doppelt Spaß zu prüfen, ob du richtig lagst.',
    ],
    early: [
      'Wie fühlt sich der Einstieg an – bist du schon richtig „drin“ in der Geschichte?',
      'Welche Erwartungen hast du gerade an das Buch? Schreib sie ruhig auf – später ist es spannend zu vergleichen.',
      'Gibt es schon eine Figur oder Stimme, die dich neugierig macht?',
      'Wie liest sich der Ton des Buches für dich – eher warm, kühl, verspielt, ernst?',
    ],
    mid: [
      'Spannender Gedanke! Was hat diese Stelle bei dir ausgelöst?',
      'Wenn du dem Autor bzw. der Autorin gerade eine Frage stellen könntest – welche wäre das?',
      'Merkst du, wie sich deine Sicht auf eine Figur verändert? Woran liegt das?',
      'Gab es zuletzt einen Satz, den du dir am liebsten markieren würdest?',
      'Was glaubst du, wohin sich die Geschichte entwickelt? Deine Vermutung bleibt hier spoilersicher notiert.',
    ],
    late: [
      'Der Endspurt! Zieht das Buch jetzt an oder lässt es dich bewusst langsam gehen?',
      'Welche Fragen muss das Ende für dich unbedingt noch beantworten?',
      'Wie soll es für deine Lieblingsfigur ausgehen – und wie, fürchtest du, geht es wirklich aus?',
    ],
  };
  b._comp = (b._comp||0) + 1;
  if(/\?\s*$/.test(userText.trim())) return pools.question[b._comp % pools.question.length];
  const pool = early ? pools.early : (late ? pools.late : pools.mid);
  return pool[b._comp % pool.length];
}

/* ---------- Tab: Regal ---------- */
function shelfBooks(){
  const f = ui.shelf;
  let list = state.books.filter(b => b.status==='finished');
  if(f.q){
    const q = f.q.toLowerCase();
    list = list.filter(b =>
      (b.title||'').toLowerCase().includes(q) ||
      (b.author||'').toLowerCase().includes(q) ||
      (b.genre||'').toLowerCase().includes(q) ||
      (b.series&&b.series.name||'').toLowerCase().includes(q) ||
      String(readYearOf(b)||'').includes(q));
  }
  if(f.year)   list = list.filter(b => String(readYearOf(b)||'') === f.year);
  if(f.genre)  list = list.filter(b => b.genre === f.genre);
  if(f.lang)   list = list.filter(b => b.language === f.lang);
  if(f.medium) list = list.filter(b => b.medium === f.medium);
  if(f.series) list = list.filter(b => b.series && b.series.name === f.series);
  const sorts = {
    'year-desc': (a,b) => (readYearOf(b)||0)-(readYearOf(a)||0) || (b.endDate||'').localeCompare(a.endDate||''),
    'year-asc':  (a,b) => (readYearOf(a)||9999)-(readYearOf(b)||9999) || (a.endDate||'').localeCompare(b.endDate||''),
    'title':     (a,b) => (a.title||'').localeCompare(b.title||'', 'de'),
    'genre':     (a,b) => (a.genre||'').localeCompare(b.genre||'','de') || (a.title||'').localeCompare(b.title||'','de'),

async function generateRecs(){
  if(!aiAvailable()){ toast('Bitte zuerst in den Einstellungen die KI verbinden.'); return; }
  const btn = $('#recbtn'); if(btn){ btn.disabled=true; btn.textContent='Denke nach…'; }
  try{
    const lib = state.books.filter(b=>b.status!=='wishlist').slice(0,60).map(b =>
      `- "${b.title}"${b.author?` von ${b.author}`:''} (${b.genre||'?'}, ${b.status==='reading'?'lese ich gerade':'gelesen'}${b.rating?`, Bewertung ${b.rating}/10`:''})`).join('\n');
    const wl = state.books.filter(b=>b.status==='wishlist').map(b=>`- ${b.title}`).join('\n') || '- (leer)';
    const raw = await aiCall([{role:'user', content:
`Hier ist mein Bücherregal:\n${lib}\n\nAuf meiner Wunschliste stehen schon:\n${wl}\n\nSchlage mir 5 Bücher vor, die gut zu meinem Geschmack passen und noch NICHT in Regal oder Wunschliste stehen. Antworte NUR mit einem JSON-Array: [{"titel":"…","autor":"…","warum":"…"}] – "warum" in 1–2 persönlichen Sätzen auf Deutsch.`}],
      'Du bist eine belesene Buchhändlerin mit feinem Gespür. Antworte ausschließlich mit validem JSON.', 1400);
    const m = raw.match(/\[[\s\S]*\]/);
    if(!m) throw new Error('parse');
    state.recs = JSON.parse(m[0]).slice(0,6);
    save(); renderApp(); toast('Frische Empfehlungen für dich');
  }catch(e){
    toast(aiErrorMessage(e));
    if(btn){ btn.disabled=false; btn.innerHTML = ic('sparkles')+' Empfehlungen erstellen'; }
  }
}

/* =====================================================================
   Cloud-Sync (optional): Ende-zu-Ende-verschlüsselt über Supabase
   ===================================================================== */
function syncConf(){
  const c = state.settings.sync;
  return (c && c.url && c.key && c.code) ? c : null;
}
async function sha256hex(str){
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2,'0')).join('');
}
async function syncAesKey(code){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: new TextEncoder().encode('novelle-sync-v1'), iterations: 150000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
function b64enc(buf){ let out=''; const a = new Uint8Array(buf); for(let i=0;i<a.length;i+=0x8000) out += String.fromCharCode.apply(null, a.subarray(i, i+0x8000)); return btoa(out); }
function b64dec(str){ const bin = atob(str); const a = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i); return a; }
async function syncEncrypt(obj, code){
  const key = await syncAesKey(code);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  const out = new Uint8Array(iv.length + ct.byteLength);
  out.set(iv); out.set(new Uint8Array(ct), iv.length);
  return b64enc(out.buffer);
}
async function syncDecrypt(b64, code){
  const key = await syncAesKey(code);
  const raw = b64dec(b64);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: raw.slice(0,12)}, key, raw.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
function syncHeaders(c){ return { 'apikey': c.key, 'Authorization': 'Bearer '+c.key, 'content-type': 'application/json' }; }
function syncBase(c){ return c.url.replace(/\/+$/,'') + '/rest/v1/novelle_sync'; }
async function syncPull(c, id){
  const res = await fetch(syncBase(c)+'?id=eq.'+id+'&select=payload', { headers: syncHeaders(c) });
  if(!res.ok) throw new Error('sync-pull-'+res.status);
  const rows = await res.json();
  if(!rows.length) return null;
  return syncDecrypt(rows[0].payload, c.code);
}
async function syncPush(c, id, lib){
  const payload = await syncEncrypt(lib, c.code);
  const res = await fetch(syncBase(c), {
    method: 'POST',
    headers: { ...syncHeaders(c), 'Prefer': 'resolution=merge-duplicates' },
    body: JSON.stringify([{ id, payload, updated_at: new Date().toISOString() }]),
  });
  if(!res.ok) throw new Error('sync-push-'+res.status);
}
function mergeLibraries(local, remote){
  const map = new Map();
  for(const b of [...(remote.books||[]), ...(local.books||[])]){
    if(!b || !b.id) continue;
    const prev = map.get(b.id);
    if(!prev || (b.updatedAt||0) >= (prev.updatedAt||0)) map.set(b.id, b);
  }
  const tombs = new Map();
  for(const t of [...(remote.deleted||[]), ...(local.deleted||[])]){
    if(!t || !t.id) continue;
    const prev = tombs.get(t.id);
    if(!prev || t.at > prev.at) tombs.set(t.id, t);
  }
  for(const [tid, t] of tombs){ const b = map.get(tid); if(b && (b.updatedAt||0) <= t.at) map.delete(tid); }
  return {
    books: [...map.values()],
    deleted: [...tombs.values()].slice(-300),
    recs: (local.recs && local.recs.length) ? local.recs : (remote.recs || []),
  };
}
let _syncBusy = false, _syncTimer = null;
async function runSync(manual=false){
  const c = syncConf(); if(!c) return;
  if(!(window.crypto && crypto.subtle)){ if(manual) toast('Cloud-Sync braucht eine sichere Verbindung (HTTPS).'); return; }
  if(_syncBusy){ if(manual) toast('Synchronisiere bereits…'); return; }
  _syncBusy = true;
  setSyncStatus('busy');
  try{
    const id = await sha256hex('novelle:'+c.code);
    const remote = await syncPull(c, id);
    const local = { books: state.books, deleted: state.deleted||[], recs: state.recs||[] };
    const merged = remote ? mergeLibraries(local, remote) : local;
    state.books = merged.books; state.deleted = merged.deleted; state.recs = merged.recs;
    state.settings.lastSync = Date.now();
    persist();
    await syncPush(c, id, merged);
    setSyncStatus('ok');
    if(manual) toast('Bibliothek synchronisiert');
    if(!document.querySelector('#overlays .sheet')) renderApp();
  }catch(e){
    setSyncStatus('error');
    if(manual){
      if(e && e.name === 'OperationError') toast('Der Sync-Code passt nicht zu den vorhandenen Cloud-Daten.');
      else toast('Cloud-Sync gerade nicht möglich – Zugangsdaten prüfen oder später erneut versuchen.');
    }
  }
  _syncBusy = false;
}
function setSyncStatus(st){
  const el = document.getElementById('syncstatus'); if(!el) return;
  el.textContent = st==='busy' ? 'synchronisiere…'
    : (st==='ok' ? 'zuletzt '+new Date(state.settings.lastSync||Date.now()).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr'
    : 'Verbindungsproblem');
}
function scheduleSync(){ if(!syncConf()) return; clearTimeout(_syncTimer); _syncTimer = setTimeout(() => runSync(false), 2500); }
function makeSyncCode(){
  const a = crypto.getRandomValues(new Uint8Array(16));
  const alph = 'abcdefghjkmnpqrstuvwxyz23456789';
  let out = '';
  for(let i=0;i<16;i++){ out += alph[a[i] % alph.length]; if(i%4===3 && i<15) out += '-'; }
  return out;
}

/* ---------- Beenden-Flow mit Fragenkatalog ---------- */
async function startFinishFlow(id, reflectionOnly=false, mode='finish'){
  const b = getBook(id); if(!b) return;
  if(reflectionOnly && mode==='finish') mode='final';
  const stored = mode==='mid' ? b.midReflection : b.reflection;
  const editing = !!(reflectionOnly && stored && stored.answers && stored.answers.length);
  const title = mode==='mid' ? 'Zwischen-Eindruck' : (reflectionOnly ? 'Dein Leseeindruck' : 'Buch beenden');
  const el = openOverlay(title, `<div id="flowbody"><div class="empty">${glyphBadge()}<p>Dein persönlicher Fragenkatalog wird vorbereitet …</p></div></div>`);
  let qs, ai = false, answers;
  if(editing){
    qs = stored.answers.map(a => a.q);
    answers = stored.answers.map(a => ({ q: a.q, a: a.a || '' }));
  } else {
    const r = await personalizedQuestions(b, mode==='mid' ? 'mid' : 'final');
    qs = r.qs; ai = r.ai;
    answers = qs.map(q => ({ q, a: '' }));
  }
  if(!el.isConnected) return;
  const flow = { step:0, qs, answers, rating: b.rating||0, endDate: b.endDate||todayISO(), reflectionOnly, ai, mode };
  renderFlow(el, b, flow);
}
function renderFlow(el, b, flow){
  const body = el.querySelector('#flowbody');
  const total = flow.qs.length + (flow.reflectionOnly ? 1 : 2); // meta + fragen + abschluss
  const dots = `<div class="flowdots">${Array.from({length:total},(_,i)=>`<i class="${i<=flow.step?'on':''}"></i>`).join('')}</div>`;

  const metaStep = !flow.reflectionOnly && flow.step===0;
  const qIndex = flow.step - (flow.reflectionOnly ? 0 : 1);
  const isSummary = qIndex >= flow.qs.length;

  if(metaStep){
    body.innerHTML = `${dots}
    <div class="flowstep">Geschafft!</div>
    <h3 class="flowq">„${esc(b.title)}“ beenden</h3>
    <div class="card" style="margin-bottom:14px">
      <label class="f"><span class="lab">Beendet am</span><input class="f" id="flow-end" type="date" value="${esc(flow.endDate)}"></label>
      <span class="lab">Deine Bewertung</span>
      <div class="rate10" id="flow-stars">${Array.from({length:10},(_,i)=>i+1).map(i=>`<button type="button" data-val="${i}" class="${i<=flow.rating?'on':''}" aria-label="${i} von 10">${i}</button>`).join('')}</div>
      <div class="plabel" id="rate-label" style="margin-top:7px">${flow.rating?flow.rating+'/10':'Tippe deine Bewertung an'}</div>
    </div>
    <p class="hint small">Gleich danach: dein persönlicher Fragenkatalog (${flow.qs.length} Fragen, ca. 5–10 Minuten)${flow.ai?' – von der KI auf dieses Buch zugeschnitten':''}. Du kannst jede Frage auch überspringen.</p>
    <button class="btn primary block" id="flow-next-btn" style="margin-top:10px">Weiter zu den Fragen</button>`;
    body.querySelector('#flow-stars').addEventListener('click', e => {
      const btn = e.target.closest('button[data-val]'); if(!btn) return;
      flow.rating = Number(btn.dataset.val);
      body.querySelectorAll('#flow-stars button').forEach(s => s.classList.toggle('on', Number(s.dataset.val)<=flow.rating));
      const lab = body.querySelector('#rate-label'); if(lab) lab.textContent = flow.rating+'/10';
    });
    body.querySelector('#flow-next-btn').addEventListener('click', () => {
      flow.endDate = body.querySelector('#flow-end').value || todayISO();
      flow.step++; renderFlow(el, b, flow);
    });
    return;
  }
  if(!isSummary){
    const item = flow.answers[qIndex];
    body.innerHTML = `${dots}
    <div class="flowstep">Frage ${qIndex+1} von ${flow.qs.length}</div>
    <h3 class="flowq">${esc(item.q)}</h3>
    <textarea class="f" id="flow-answer" rows="6" placeholder="Deine Gedanken…">${esc(item.a)}</textarea>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="flow-back-btn">Zurück</button>
      <button class="btn primary grow" id="flow-next-btn">${qIndex===flow.qs.length-1?'Abschließen':'Weiter'}</button>
    </div>`;
    const ta = body.querySelector('#flow-answer'); ta.focus();
    body.querySelector('#flow-next-btn').addEventListener('click', () => { item.a = ta.value; flow.step++; renderFlow(el, b, flow); });
    body.querySelector('#flow-back-btn').addEventListener('click', () => { item.a = ta.value; flow.step=Math.max(0, flow.step-1); if(flow.reflectionOnly && flow.step<0) flow.step=0; renderFlow(el, b, flow); });
    return;
  }
  // Abschluss & speichern
  if(!flow.reflectionOnly){
    b.status = 'finished';
    b.endDate = flow.endDate;
    if(!b.startDate) b.startDate = null;
  }
  if(flow.mode==='mid'){
    b.midReflection = { answers: flow.answers, completedAt: new Date().toISOString() };
    touch(b); save();
    body.innerHTML = `
    <div class="empty" style="padding-top:20px">
      ${glyphBadge()}
      <h3>Zwischen-Eindruck gespeichert</h3>
      <p>Du findest ihn jederzeit im Buch – und wenn du das Buch beendest, hilft er dir beim Erinnern.</p>
    </div>
    <button class="btn primary block" id="flow-done-btn">Fertig</button>`;
    body.querySelector('#flow-done-btn').addEventListener('click', () => { closeAllOverlays(); openBookDetail(b.id); });
    return;
  }
  b.rating = flow.rating || b.rating || null;
  b.reflection = { answers: flow.answers, completedAt: new Date().toISOString() };
  touch(b); save();
  const answered = flow.answers.filter(a=>a.a.trim()).length;
  body.innerHTML = `
  <div class="empty" style="padding-top:20px">
    ${glyphBadge()}
    <h3>„${esc(b.title)}“ steht jetzt in deinem Regal</h3>
    <p>${answered?`${answered} ${answered===1?'Antwort':'Antworten'} gespeichert – du findest deinen Leseeindruck jederzeit im Buch.`:'Du kannst den Fragenkatalog später jederzeit im Buch nachholen.'}</p>
  </div>
  <div class="stack">
    <button class="btn menu" data-action="gen-facts" data-id="${b.id}">${ic('cap')} 10 Fakten zu Buch & Autor·in<span class="chev">${ic('chev')}</span></button>
    <button class="btn menu" data-action="gen-community" data-id="${b.id}">${ic('users')} Stimmen aus der Lese-Community<span class="chev">${ic('chev')}</span></button>
    <button class="btn primary block" id="flow-done-btn">Fertig</button>
  </div>`;
  body.querySelector('#flow-done-btn').addEventListener('click', () => { closeAllOverlays(); ui.tab='shelf'; renderApp(); });
}

    ta.value='';
    b.chat.push({role:'user', content:text, at:Date.now()});
    log.insertAdjacentHTML('beforeend', `<div class="msg user">${esc(text)}</div>`);
    scroll();
    const tmp = document.createElement('div');
    tmp.className='msg bot thinking'; tmp.textContent='schreibt…';
    log.appendChild(tmp); scroll();
    let reply;
    if(aiAvailable()){
      try{
        const sys = `Du bist ein herzlicher, belesener Lesebegleiter in der Bücher-App Novelle. Die Nutzerin liest gerade "${b.title}"${b.author?` von ${b.author}`:''}${b.genre?` (${b.genre})`:''}${b.status==='finished'?' und hat es bereits BEENDET – ihr dürft über das ganze Buch sprechen':''}.
${b.status!=='finished'?`WICHTIG – SPOILERSCHUTZ: Sie ist erst bei ${boundaryLabel(b)}. Sprich ausschließlich über Inhalte bis zu dieser Stelle. Verrate NICHTS, was danach passiert – auch nicht andeutungsweise und auch nicht auf direkte Nachfrage. Biete stattdessen an, gemeinsam spoilerfrei zu spekulieren.`:''}
Antworte auf Deutsch, warm und prägnant (höchstens ~120 Wörter), stelle gern eine Rückfrage. Wenn du das Buch nicht sicher kennst, sage das ehrlich und arbeite mit dem, was die Nutzerin erzählt.`;
        const msgs = b.chat.slice(-24).map(m=>({role: m.role==='user'?'user':'assistant', content:m.content}));
        reply = await aiCall(msgs, sys, 700);
      }catch(err){
        reply = companionReply(b, text) + '\n\n(' + aiErrorMessage(err) + ')';
      }
    } else {
      await new Promise(r=>setTimeout(r, 450));
      reply = companionReply(b, text);
    }
    b.chat.push({role:'assistant', content:reply, at:Date.now()});
    touch(b); save();
    tmp.classList.remove('thinking'); tmp.textContent = reply;
    scroll();
  });
}

/* ---------- Buchdaten automatisch ausfüllen (KI) ---------- */
async function autofillBook(form, silent=false){
  const title = form.title.value.trim();
  if(!title){ if(!silent) toast('Erst den Titel eintragen.'); return; }
  if(form._autofillBusy) return;
  form._autofillBusy = true;
  const btn = form.querySelector('#autofillbtn');
  const prev = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Suche Buchdaten…'; }
  try{
    const raw = await aiCall([{role:'user', content:
`Gib mir Eckdaten zum Buch "${title}"${form.author.value.trim()?` von ${form.author.value.trim()}`:''}.
Antworte NUR als JSON, ohne weiteren Text:
{"autor":"Vor- und Nachname","erscheinungsjahr":"Jahr der Erstausgabe","erscheinungsort":"Verlagsort der Erstausgabe","genre":"genau ein Eintrag aus dieser Liste: ${GENRES.join(' | ')}","reihe":"Name der Buchreihe oder leer","band":"Bandnummer oder leer"}
Wichtig: Wenn du das Buch nicht sicher kennst oder ein Feld nicht sicher weißt, setze dieses Feld auf "" statt zu raten.`}],
      'Du bist eine präzise Bibliothekarin. Antworte ausschließlich mit validem JSON und erfinde nichts.', 400);
    const m = raw.match(/\{[\s\S]*\}/);
    if(!m) throw new Error('parse');
    const d = JSON.parse(m[0]);
    let filled = 0;
    const put = (field, val) => { if(val && field && !field.value.trim()){ field.value = String(val).trim(); filled++; } };
    put(form.author, d.autor);
    put(form.pubYear, d.erscheinungsjahr);
    put(form.pubPlace, d.erscheinungsort);
    if(d.genre && !form.genre.value){ const hit = GENRES.find(g => String(d.genre).includes(g)); if(hit){ form.genre.value = hit; filled++; } }
    put(form.seriesName, d.reihe);
    put(form.seriesVol, d.band);
    if(filled) toast(`${filled} ${filled===1?'Feld':'Felder'} automatisch ausgefüllt`);
    else if(!silent) toast('Die KI kennt dieses Buch nicht sicher – bitte selbst ergänzen.');
  }catch(e){
    if(!silent) toast(aiErrorMessage(e));
  }
  if(btn){ btn.disabled = false; btn.innerHTML = prev; }
  form._autofillBusy = false;
}

/* ---------- Genre-Vorschlag (KI) ---------- */
async function suggestGenre(btn){
  const form = btn.closest('form');
  const title = form.title.value.trim(), author = form.author.value.trim();
  if(!title){ toast('Erst den Titel eintragen.'); return; }
  btn.disabled = true; btn.textContent='…';
  try{
    const raw = await aiCall([{role:'user', content:`Welches Genre hat das Buch "${title}"${author?` von ${author}`:''}? Antworte mit GENAU einem Eintrag aus dieser Liste, ohne weiteren Text: ${GENRES.join(' | ')}`}], null, 60);
    const hit = GENRES.find(g => raw.includes(g));
    if(hit){ form.genre.value = hit; toast(`Eingeschätzt: ${hit}`); }
    else toast('Konnte das Genre nicht sicher einschätzen.');
  }catch(e){ toast(aiErrorMessage(e)); }
  btn.disabled = false; btn.innerHTML = ic('sparkles');
}

/* =====================================================================
   Aktionen (Event-Delegation)
   ===================================================================== */
const ACTIONS = {
  'tab': el => { ui.tab = el.dataset.tab; closeAllOverlays(); },
  'add-book': el => openBookForm(null, el.dataset.preset || (ui.tab==='shelf'?'finished':(ui.tab==='discover'?'wishlist':'reading'))),
  'open-book': el => openBookDetail(el.dataset.id),
  'edit-book': el => openBookForm(getBook(el.dataset.id)),
  'delete-book': el => {
    const id = el.dataset.id;
    if(ui.deleteArmed === id){
      state.books = state.books.filter(b=>b.id!==id);
      (state.deleted = state.deleted || []).push({ id, at: Date.now() });
      save(); closeAllOverlays(); toast('Buch gelöscht');
    } else {
      ui.deleteArmed = id;
      el.textContent = 'Wirklich löschen? Nochmal tippen';
      setTimeout(()=>{ if(ui.deleteArmed===id){ ui.deleteArmed=null; if(el.isConnected) el.textContent='Löschen'; } }, 3500);
    }
  },
  'rate-book': el => {
    const b = getBook(el.dataset.id); if(!b) return;
    b.rating = Number(el.dataset.val);
    touch(b); save();
    const row = el.parentElement;
    row.querySelectorAll('button').forEach(x => x.classList.toggle('on', Number(x.dataset.val) <= b.rating));
    const lab = document.getElementById('detail-rate-label'); if(lab) lab.textContent = b.rating + '/10';
    toast('Bewertung gespeichert: ' + b.rating + '/10');
  },
  'start-finish': el => startFinishFlow(el.dataset.id, false),
  'start-reflection': el => startFinishFlow(el.dataset.id, true, 'final'),
  'edit-reflection': el => startFinishFlow(el.dataset.id, true, 'final'),
  'mid-reflection': el => startFinishFlow(el.dataset.id, true, 'mid'),
  'gen-summary': el => genSummary(el.dataset.id),
  'open-mysummary': el => openMySummary(el.dataset.id),
  'edit-progress': el => openProgress(el.dataset.id),
  'open-chat': el => openChat(el.dataset.id),
  'mark-read-now': el => {
    const b = getBook(el.dataset.id); if(!b) return;
    b.status='reading'; b.startDate = todayISO(); touch(b);
    save(); closeAllOverlays(); ui.tab='reading'; renderApp(); toast('Viel Freude beim Lesen!');
  },
  'close-overlay': () => closeOverlay(),
  'intro-dismiss': () => { state.settings.seenIntro = true; save(); renderApp(); },
  'set-palette': el => {
    state.settings.palette = el.dataset.id==='navy' ? 'navy' : 'aura';
    save(); applyPalette(); renderApp();
    toast(state.settings.palette==='navy' ? 'Farbwelt: Nacht' : 'Farbwelt: Aura');
  },
  'save-settings': () => {
    state.settings.apiKey = $('#set-key').value.trim();
    state.settings.model = $('#set-model').value;
    save(); renderApp(); toast(state.settings.apiKey ? 'KI verbunden' : 'Gespeichert – Begleiter-Modus aktiv');
  },
  'export-backup': () => exportBackup(),
  'sync-now': () => runSync(true),
  'sync-off': () => { delete state.settings.sync; persist(); renderApp(); toast('Cloud-Sync getrennt – deine Daten bleiben lokal erhalten.'); },
  'sync-gencode': () => { const el = $('#sync-code'); if(el) el.value = makeSyncCode(); },
  'sync-on': () => {
    const url = $('#sync-url').value.trim().replace(/\/+$/,'');
    const key = $('#sync-key').value.trim();
    const code = $('#sync-code').value.trim();
    if(!/^https:\/\//.test(url)){ toast('Bitte die Projekt-URL prüfen (beginnt mit https://).'); return; }
    if(!key){ toast('Bitte den anon public key einfügen.'); return; }
    if(code.length < 8){ toast('Der Sync-Code sollte mindestens 8 Zeichen haben.'); return; }
    state.settings.sync = { url, key, code };
    persist();
    runSync(true);
  },
  'gen-recs': () => generateRecs(),
  'add-rec': el => {
    const r = (state.recs||[])[Number(el.dataset.id)]; if(!r) return;
    state.books.push({ id:uid(), title:r.titel, author:r.autor||'', status:'wishlist', notes:r.warum||'', addedAt:new Date().toISOString(), updatedAt:Date.now() });
    save(); renderApp(); toast('Auf die Wunschliste gesetzt');
  },
  'gen-facts': el => genFacts(el.dataset.id),
  'gen-community': el => genCommunity(el.dataset.id),
  'suggest-genre': (el,_,e) => { e.preventDefault(); suggestGenre(el); },
  'autofill-book': (el,_,e) => { e.preventDefault(); const f = el.closest('form'); if(f) autofillBook(f, false); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const fn = ACTIONS[el.dataset.action];
  if(fn) fn(el, el.dataset.id, e);
});

function applyPalette(){
  if(state.settings.palette==='navy') document.documentElement.setAttribute('data-palette','navy');
  else document.documentElement.removeAttribute('data-palette');
}

/* Start */
applyPalette();
renderApp();
if(syncConf()) runSync(false);
setTimeout(() => {
  const sp = $('#splash');
  if(sp){ sp.style.opacity = '0'; setTimeout(() => sp.remove(), 260); }
}, 600);
</script>
